<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados CCI Awards</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Segoe UI,sans-serif;
  background:#0b0b0f;
  color:#fff;
  margin:0;
  padding:40px;
}
h1{
  color:#d4af37;
  text-align:center;
}
input,button{
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:none;
}
button{
  background:#d4af37;
  font-weight:bold;
  cursor:pointer;
}
.categoria{
  margin-bottom:40px;
}
.categoria h2{
  color:#d4af37;
  border-bottom:1px solid #d4af37;
}
li{
  margin:6px 0;
}
</style>
</head>

<body>

<h1>Resultados CCI Servers Awards 2025</h1>

<div id="login">
  <p>Ingrese contraseña para ver resultados:</p>
  <input type="password" id="pass">
  <button onclick="acceder()">Entrar</button>
</div>

<div id="resultados" style="display:none"></div>

<script>
/* 🔐 CONTRASEÑA */
const PASSWORD = "cci2025";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDNjbPpBErQ1i_T-Whz0FOraA4g57URT6o",
  authDomain: "cci-awards.firebaseapp.com",
  projectId: "cci-awards",
  storageBucket: "cci-awards.firebasestorage.app",
  messagingSenderId: "261650236186",
  appId: "1:261650236186:web:8810d9ad382f850520e2a3",
  measurementId: "G-T6KECXWYD2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function acceder(){
  if(document.getElementById("pass").value !== PASSWORD){
    alert("Contraseña incorrecta");
    return;
  }
  document.getElementById("login").style.display="none";
  document.getElementById("resultados").style.display="block";
  cargarResultados();
}

async function cargarResultados(){
  const snap = await db.collection("votos").get();
  let conteo = {};

  snap.forEach(doc=>{
    const [categoria, nominado] = doc.id.split("||");
    const total = doc.data().total || 0;

    if(!conteo[categoria]) conteo[categoria] = [];
    conteo[categoria].push({ nominado, total });
  });

  let html = "";
  for(const cat in conteo){
    html += `<div class="categoria"><h2>${cat}</h2><ol>`;
    conteo[cat]
      .sort((a,b)=>b.total - a.total)
      .slice(0,3)
      .forEach(item=>{
        html += `<li>${item.nominado} – ${item.total} votos</li>`;
      });
    html += "</ol></div>";
  }

  document.getElementById("resultados").innerHTML = html;
}
</script>

</body>
</html>
