<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados CCI Awards</title>
<style>
body{ background:#0b0b0f; color:#fff; font-family:Segoe UI,sans-serif; padding:40px; }
h1,h2{ color:#d4af37; }
.ganador{ color:#4caf50; font-weight:bold; }
</style>
</head>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔐 CONTRASEÑA */
if(prompt("Contraseña") !== "CCI2025"){
  document.body.innerHTML = "";
  throw new Error("No autorizado");
}

/* 👇 MISMO firebaseConfig */
const firebaseConfig = {
  apiKey: "AIzaSyDNjbPpBErQ1i_T-Whz0FOraA4g57URT6o",
  authDomain: "cci-awards.firebaseapp.com",
  projectId: "cci-awards",
  storageBucket: "cci-awards.firebasestorage.app",
  messagingSenderId: "261650236186",
  appId: "1:261650236186:web:8810d9ad382f850520e2a3",
  measurementId: "G-T6KECXWYD2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const snap = await getDocs(collection(db,"votos"));
const data = {};

snap.forEach(d=>{
  const [cat, nom] = d.id.split("||");
  data[cat] ??= {};
  data[cat][nom] = d.data().total;
});

document.write("<h1>Resultados CCI Awards 2025</h1>");

for(const cat in data){
  const total = Object.values(data[cat]).reduce((a,b)=>a+b,0);
  const ganador = Object.entries(data[cat]).sort((a,b)=>b[1]-a[1])[0];

  document.write(`<h2>${cat}</h2><ul>`);
  for(const n in data[cat]){
    const v = data[cat][n];
    const p = ((v/total)*100).toFixed(1);
    const cls = n===ganador[0]?"ganador":"";
    document.write(`<li class="${cls}">${n}: ${v} votos (${p}%)</li>`);
  }
  document.write(`<p class="ganador">🏆 Ganador: ${ganador[0]}</p></ul>`);
}
</script>

</body>
</html>
