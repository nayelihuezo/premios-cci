<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#0b0b0f;
  color:#fff;
}

header{
  background:#000;
  padding:40px;
  text-align:center;
  border-bottom:2px solid #d4af37;
}

header h1{
  color:#d4af37;
  letter-spacing:3px;
}

.container{
  width:90%;

.category{

.category h2{
  color:#d4af37;
  border-bottom:1px solid #d4af37;
  padding-bottom:10px;
}

/* 🟦 GRID */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-top:20px;
}

@media (max-width: 900px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media (max-width: 500px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

.card{
  background:#151520;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

button{
  margin-top:15px;
  background:#d4af37;
  border:none;
  padding:14px 32px;
  border-radius:25px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  width:100%;
}

button:disabled{
  background:#444;
  color:#aaa;
  cursor:not-allowed;
}

.mensaje{
  margin-top:10px;
  color:#d4af37;
  font-size:14px;
}

  #finalizarBox button{
  background:#d4af37;
  border:none;
  padding:16px 40px;
  border-radius:30px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.finalizar-box{
  display:none;
  text-align:center;
  margin-top:30px;   /* 🔑 espacio corto */
}

.finalizar-box button{
  background:#d4af37;
  border:none;
  padding:16px 36px;
  border-radius:30px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}


</style>
</head>

<body>

<div class="container">

<script>
function crearCategoria(nombre, nominados){
  let html = `<section class="category" data-cat="${nombre}">
    <h2>${nombre}</h2>
    <div class="cards">`;

  nominados.forEach(n=>{
    html += `
    <div class="card">
      <h3>${n}</h3>
      <button onclick="votar('${nombre}', this)">Votar</button>
    </div>`;
  });

  html += `</div><div class="mensaje"></div></section>`;
  document.write(html);
}
</script>

<!-- 🔥 Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNjbPpBErQ1i_T-Whz0FOraA4g57URT6o",
  authDomain: "cci-awards.firebaseapp.com",
  projectId: "cci-awards",
  storageBucket: "cci-awards.firebasestorage.app",
  messagingSenderId: "261650236186",
  appId: "1:261650236186:web:8810d9ad382f850520e2a3",
  measurementId: "G-T6KECXWYD2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.votar = async function(categoria, boton){
  const votosLocal = JSON.parse(localStorage.getItem("votosCCI")) || {};

  if(votosLocal[categoria]){
    alert("⚠️ Ya votaste en esta categoría");
    return;
  }

  const nominado = boton.parentElement.querySelector("h3").innerText;
  const id = categoria + "||" + nominado;

  await setDoc(
    doc(db, "votos", id),
    { total: increment(1) },
    { merge: true }
  );

  votosLocal[categoria] = true;
  localStorage.setItem("votosCCI", JSON.stringify(votosLocal));

  const seccion = boton.closest(".category");
  seccion.querySelectorAll("button").forEach(b=>b.disabled=true);
  seccion.querySelector(".mensaje").innerText =
    "✔️ Ya votaste en esta categoría.";
};
</script>

<!-- 🔒 Bloquear votos al volver a entrar -->
<script>
document.addEventListener("DOMContentLoaded", ()=>{
  const votosLocal = JSON.parse(localStorage.getItem("votosCCI")) || {};

  document.querySelectorAll(".category").forEach(cat=>{
    const nombre = cat.getAttribute("data-cat");
    if(votosLocal[nombre]){
      cat.querySelectorAll("button").forEach(b=>b.disabled=true);
      cat.querySelector(".mensaje").innerText =
        "✔️ Ya votaste en esta categoría";
    }
  });
});
</script>
  
  <div id="finalizarBox" style="display:none; text-align:center; margin:60px 0;">
  <h2 style="color:#d4af37;">
  <button onclick="finalizarEncuesta()">Finalizar</button>
</div>
  
  <script>
function revisarFinalizacion(){
  const votosLocal = JSON.parse(localStorage.getItem("votosCCI")) || {};
  const totalCategorias = document.querySelectorAll(".category").length;

  if(Object.keys(votosLocal).length === totalCategorias){
    document.getElementById("finalizarBox").style.display = "block";
  }
}

function finalizarEncuesta(){
  document.body.innerHTML = `
    <div style="text-align:center; padding:80px; font-family:Segoe UI;">
      <h1 style="color:#d4af37;">🎉 ¡Gracias por votar!</h1>
      <p>Tu participación ha sido registrada.</p>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", revisarFinalizacion);
</script>
