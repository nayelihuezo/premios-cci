<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CCI SERVERS AWARDS</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#0b0b0f;
  color:#fff;
}
header{
  background:#000;
  padding:40px;
  text-align:center;
  border-bottom:2px solid #d4af37;
}
header h1{ color:#d4af37; letter-spacing:3px; }
.container{ width:90%; max-width:1100px; margin:auto; padding:40px 0; }
.category{ margin-bottom:60px; }
.category h2{ color:#d4af37; border-bottom:1px solid #d4af37; padding-bottom:10px; }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:20px; }
.card{ background:#151520; padding:20px; border-radius:15px; text-align:center; }
button{ margin-top:15px; background:#d4af37; border:none; padding:8px 20px; border-radius:20px; font-weight:bold; cursor:pointer; }
button:disabled{ background:#444; color:#aaa; }
.mensaje{ margin-top:10px; color:#d4af37; font-size:14px; }
</style>
</head>

<body>

<header>
<h1>CCI SERVERS AWARDS 2025</h1>
<p>Vota una sola vez por cada categoría</p>
</header>

<div class="container">

<script>
function crearCategoria(nombre, nominados){
  let html = `<section class="category" data-cat="${nombre}">
    <h2>${nombre}</h2>
    <div class="cards">`;
  nominados.forEach(n=>{
    html += `
    <div class="card">
      <h3>${n}</h3>
      <button onclick="votar('${nombre}', this)">Votar</button>
    </div>`;
  });
  html += `</div><div class="mensaje"></div></section>`;
  document.write(html);
}
</script>

<script>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 👇 firebaseConfig */
const firebaseConfig = {
  apiKey: "AIzaSyDNjbPpBErQ1i_T-Whz0FOraA4g57URT6o",
  authDomain: "cci-awards.firebaseapp.com",
  projectId: "cci-awards",
  storageBucket: "cci-awards.firebasestorage.app",
  messagingSenderId: "261650236186",
  appId: "1:261650236186:web:8810d9ad382f850520e2a3",
  measurementId: "G-T6KECXWYD2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.votar = async function(categoria, boton){
  const nominado = boton.parentElement.querySelector("h3").innerText;
  const id = categoria + "||" + nominado;

  await setDoc(
    doc(db, "votos", id),
    { total: increment(1) },
    { merge: true }
  );

  const seccion = boton.closest(".category");
  seccion.querySelectorAll("button").forEach(b=>b.disabled=true);
  seccion.querySelector(".mensaje").innerText =
    "✔️ Voto registrado. Gracias por participar";
}
</script>

</body>
